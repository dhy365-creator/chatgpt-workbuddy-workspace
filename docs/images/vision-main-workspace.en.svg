<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="605" viewBox="0 0 1600 605" role="img" aria-label="Manual collaboration workflow: ChatGPT plans and reviews, CodeBuddy CLI executes">
<defs><filter id="soft"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#92ADA3" flood-opacity=".17"/></filter></defs>
<rect x="0" y="0" width="1600" height="605" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="64" y="81" font-family="Arial,Helvetica,sans-serif" font-size="48" fill="#172A23" font-weight="700">One workspace. More ways to build.</text>
<text x="67" y="126" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#60756B" font-weight="400">Keep ChatGPT for planning and reviews. Run tasks with the coding agent you choose.</text>
<rect x="66" y="168" width="585" height="335" rx="24" fill="#F3FBF8" stroke="#D7EAE0" stroke-width="2" filter="url(#soft)"/>
<rect x="100" y="204" width="70" height="70" rx="16" fill="#D9F3E7" stroke="#D9F3E7" stroke-width="2"/>
<text x="123" y="251" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#239469" font-weight="700">C</text>
<text x="191" y="235" font-family="Arial,Helvetica,sans-serif" font-size="33" fill="#1D4030" font-weight="700">ChatGPT Chat</text>
<text x="192" y="271" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4B7C66" font-weight="500">Main desk: plan, coordinate, review</text>
<rect x="100" y="314" width="509" height="61" rx="15" fill="#FFFFFF" stroke="#ECF4EF" stroke-width="2"/>
<text x="120" y="354" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#243B33" font-weight="400">1   Define task and acceptance criteria</text>
<rect x="100" y="394" width="509" height="61" rx="15" fill="#FFFFFF" stroke="#ECF4EF" stroke-width="2"/>
<text x="120" y="433" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#243B33" font-weight="400">4   Review results and iterate</text>
<path d="M670,295 C710,295 742,295 784,295" stroke="#239A75" stroke-width="4" stroke-dasharray="8 9" fill="none"/>
<text x="682" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#25906F" font-weight="600">2  Copy task</text>
<path d="M785,400 C746,400 711,400 670,400" stroke="#CE9D43" stroke-width="4" stroke-dasharray="8 9" fill="none"/>
<text x="685" y="439" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#A37C2E" font-weight="600">3  Bring back results</text>
<rect x="809" y="168" width="727" height="160" rx="22" fill="#FFFFFF" stroke="#D5EAE1" stroke-width="2" filter="url(#soft)"/>
<rect x="844" y="199" width="69" height="69" rx="18" fill="#E7F5EE" stroke="#E7F5EE" stroke-width="2"/>
<text x="858" y="246" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#238C67" font-weight="700">&gt;_</text>
<text x="937" y="226" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#233E32" font-weight="700">CodeBuddy / WorkBuddy</text>
<text x="937" y="266" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#52655B" font-weight="400">Coding, files, terminal, agent tasks</text>
<rect x="1332" y="276" width="172" height="34" rx="17" fill="#E7F5ED" stroke="#E7F5ED" stroke-width="2"/>
<text x="1350" y="300" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#258060" font-weight="600">Included here</text>
<rect x="809" y="346" width="727" height="157" rx="22" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/>
<rect x="844" y="376" width="69" height="69" rx="18" fill="#F2F4F7" stroke="#F2F4F7" stroke-width="2"/>
<text x="858" y="423" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#677385" font-weight="700">&gt;_</text>
<text x="937" y="405" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#34424A" font-weight="700">OpenCode / other CLI tools</text>
<text x="937" y="448" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#617078" font-weight="400">Same manual workflow idea</text>
<rect x="1351" y="454" width="153" height="33" rx="16" fill="#F1F2F5" stroke="#F1F2F5" stroke-width="2"/>
<text x="1362" y="477" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#66727E" font-weight="600">Concept only</text>
<text x="66" y="554" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#546E61" font-weight="400">This tool currently launches CodeBuddy Web. It does NOT connect AI agents automatically.</text>
<text x="66" y="587" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#8C9F95" font-weight="400">Human handoff  |  Optional providers  |  No quota or permission bypass</text>
</svg>
