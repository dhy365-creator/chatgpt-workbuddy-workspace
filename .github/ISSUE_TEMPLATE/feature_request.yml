name: "💡 功能建议"
description: "建议功能、改善安装体验或分享同屏协作方案"
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎交流！当前版本主要负责 CodeBuddy 官方原生 Web 启动，并以**人工交接**实现 ChatGPT + CodeBuddy 同屏协作。其他 CLI 的自动集成并非现有功能。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      placeholder: "描述你真实的使用场景和阻碍..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你建议怎样改进？
      placeholder: "期望流程、示例或交互方式..."
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 你目前的解决方式（可选）
      description: "请不要包含密码和私人会话信息。"
