name: "🐛 Bug / 安装问题"
description: "Report a macOS/Windows install or startup issue / 反馈安装或运行问题"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English and 简体中文 are both welcome.
        **Never submit passwords, Token, Cookie, authentication QR codes, private chats, private project files, or secret-bearing URLs.**
        感谢反馈！请勿上传密码、Token、Cookie、扫码二维码、个人对话或私有资料。请通过 Security 页面私密报告漏洞。
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Other / 其他
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method / 安装方式
      options:
        - Codex with GitHub URL / 使用 Codex 安装
        - Manual npm install / 手动 npm 安装
        - Other / 其他
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Account region / 账号地区（optional / 可选）
      options:
        - International Site / 国际站
        - Chinese Site / 国内站
        - Other / 其他
        - Prefer not to say / 不提供
  - type: input
    id: version
    attributes:
      label: Versions / 软件版本
      description: "Node.js, npm, CodeBuddy CLI, workbuddy-web (no credentials) / 请勿上传任何账号凭据"
      placeholder: "Node v24; npm 11; CodeBuddy 2.x; workbuddy-web 0.2.2"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: "Provide a minimal reproducible sequence / 只写必要步骤"
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and REDACTED errors / 实际行为与已脱敏报错
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional details / 其他补充（optional / 可选）
      description: "Only REDACTED logs/screenshots / 仅上传已脱敏的日志和截图"
